[package]
name = "claude-skill-gen"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Generate Claude Skills from llms.txt documentation files"
license = "MIT"
readme = "README.md"
keywords = ["claude", "ai", "skills", "llms-txt", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "claude-skill-gen"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
url = "2.5"
globset = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
